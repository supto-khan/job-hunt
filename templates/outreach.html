<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outreach - Job Scraper</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/static/favicon.png">

    <!-- Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="stylesheet" href="/static/style.css?v=8">
</head>
<body>
    <div class="header">
        <div style="display:flex;align-items:center;gap:24px;">
            <a href="/" class="brand-logo">
                <img src="/static/favicon.svg" alt="Job Hunter Logo" style="width:32px;height:32px;border-radius:8px;object-fit:contain;flex-shrink:0;">
                <h1>Job Hunter</h1>
            </a>
            <nav class="nav-tabs">
                <a href="/" class="nav-tab">Jobs</a>
                <a href="/outreach" class="nav-tab active">Outreach</a>
                <a href="/profile" class="nav-tab">Profile</a>
            </nav>
        </div>
        <div class="header-actions">
            <span id="active-profile-indicator" style="font-size:12px;color:var(--text-muted);">Profile: …</span>
            <button class="btn btn-outline" id="btn-preview" onclick="previewEmail()">Preview Email</button>
            <button class="btn btn-yellow" id="btn-send" onclick="sendEmailNow()">Send Email Now</button>
            <button class="btn btn-outline" id="btn-sync" onclick="syncOutreach()" title="Generate 15 new outreach items from jobs already in the DB — no collection run">⟳ Sync</button>
            <button class="btn btn-green" id="btn-refresh" onclick="refreshOutreach()" title="Run a fresh Collect Jobs, then generate 15 new outreach items from the results">🔄 Refresh</button>
        </div>
    </div>

    <div class="stats-bar" id="stats-bar"></div>

    <nav class="tab-bar" style="padding:0 32px;">
        <a class="tab-link active" data-batch="new" onclick="switchBatch('new')">New (latest batch)</a>
        <a class="tab-link" data-batch="old" onclick="switchBatch('old')">Old</a>
        <a class="tab-link" data-batch="all" onclick="switchBatch('all')">All</a>
        <span id="batch-info" style="margin-left:auto;font-size:12px;color:var(--text-muted);align-self:center;"></span>
    </nav>

    <div class="filters">
        <div class="filter-group">
            <label>Status</label>
            <select id="filter-status" onchange="loadOutreach()">
                <option value="">All</option>
                <option value="pending" selected>Pending (Ready to Send)</option>
                <option value="emailed">Emailed (Ready to Message)</option>
                <option value="messaged">Messaged</option>
                <option value="replied">Replied</option>
                <option value="followed_up">Followed Up</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Search</label>
            <input type="text" id="filter-search" placeholder="Company, role, contact...">
        </div>
        <div id="bulk-actions" class="filter-group" hidden style="margin-left:auto;flex-direction:row;align-items:flex-end;gap:8px;">
            <label style="font-size:12px;"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"> Select all</label>
            <span id="selected-count" style="font-size:12px;color:var(--text-muted);">0 selected</span>
            <button class="btn btn-outline" style="color:var(--red);border-color:var(--red);" onclick="bulkDeleteSelected()">Delete Selected</button>
        </div>
    </div>

    <div class="content">
        <div id="outreach-list"></div>
    </div>

    <!-- Activity Notification Modal -->
    <div class="modal-overlay" id="activity-modal-overlay" onclick="if(event.target===this)closeActivityModal()">
        <div class="modal" id="activity-modal-content" style="width:420px;text-align:center;padding:28px 24px;">
            <div id="activity-modal-icon" style="font-size:36px;margin-bottom:12px;">ℹ️</div>
            <h3 id="activity-modal-title" style="font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text);">System Notice</h3>
            <p id="activity-modal-body" style="font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:20px;"></p>
            <button class="btn btn-primary" onclick="closeActivityModal()" style="width:100%;">Got it</button>
        </div>
    </div>

    <!-- Confirm Action Modal -->
    <div class="modal-overlay" id="confirm-modal-overlay">
        <div class="modal" style="width:420px;text-align:center;padding:28px 24px;">
            <div style="font-size:36px;margin-bottom:12px;">❓</div>
            <h3 id="confirm-modal-title" style="font-size:18px;font-weight:600;margin-bottom:8px;color:var(--text);">Confirm Action</h3>
            <p id="confirm-modal-body" style="font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:20px;"></p>
            <div style="display:flex;gap:12px;">
                <button class="btn btn-outline" id="confirm-btn-cancel" style="flex:1;">Cancel</button>
                <button class="btn btn-primary" id="confirm-btn-ok" style="flex:1;">Confirm</button>
            </div>
        </div>
    </div>

    <script src="/static/outreach.js?v=8"></script>
</body>
</html>
